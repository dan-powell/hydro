; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:wemos_d1_mini32]
; pioarduino community platform (Arduino-ESP32 3.x / ESP-IDF 5.x)
; Releases: https://github.com/pioarduino/platform-espressif32/releases
; Pinned to 55.03.311: 55.03.312+ requires PlatformIO Core >=6.2.0, and Core 6.2.0
; reports itself as 6.2.0.post1, which fails that check
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = wemos_d1_mini32
framework = arduino
#upload_speed = 115200
lib_deps = 
	adafruit/Adafruit SSD1306@^2.4.6
	adafruit/Adafruit GFX Library@^1.10.11
	adafruit/Adafruit BusIO@^1.9.1
; Don't use chain+: it evaluates #if conditions without the chip's SOC_* macros
; and misses the Network library that WiFi depends on in Arduino-ESP32 3.x
lib_ldf_mode = chain
monitor_speed = 115200